<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 주변 영화·드라마 촬영지 지도</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
            background-color: #1a1a1a;
        }

        /* 전체 화면 2분할 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 왼쪽: 사이드바 영역 (30%) */
        .sidebar {
            width: 30%;
            height: 100%;
            background-color: #222222;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
        }

        /* 타이틀 스타일 */
        .title-box {
            margin-bottom: 20px;
            text-align: center;
        }

        .title-box h2 {
            color: #ffcc00;
            font-size: 20px;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .title-box p {
            color: #888;
            font-size: 12px;
        }

        /* 카테고리 탭 스타일 */
        .tab-box {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background-color: #333;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #ffcc00;
            border-color: #ffcc00;
            color: #111;
        }

        /* 장소 리스트 영역 (스크롤 가능) */
        .places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .places-list::-webkit-scrollbar {
            width: 6px;
        }
        .places-list::-webkit-scrollbar-thumb {
            background-color: #444;
            border-radius: 3px;
        }

        .place-item {
            padding: 15px;
            border-bottom: 1px solid #333;
            background-color: #2b2b2b;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .place-item:hover {
            background-color: #383838;
            transform: translateY(-2px);
            border-color: #ffcc00;
        }

        .place-item h4 {
            margin-bottom: 6px;
            color: #fff;
            font-size: 15px;
        }

        .place-item p {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .place-item .distance-tag {
            display: inline-block;
            font-size: 11px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* 오른쪽: 지도 영역 (70%) */
        .map-container {
            width: 70%;
            height: 100%;
        }

        /* 커스텀 말풍선(InfoWindow) 스타일 */
        .custom-infowindow {
            padding: 10px;
            background: #fff;
            color: #333;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 12px;
            min-width: 200px;
        }
        .custom-infowindow h5 {
            font-size: 14px;
            margin-bottom: 5px;
            color: #111;
        }
        .custom-infowindow p {
            margin-bottom: 5px;
            color: #666;
        }
        .custom-infowindow a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
        }
        .custom-infowindow a:hover {
            text-decoration: underline;
        }
    </style>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=486285cc8eaace2dade6833425ef6538&libraries=services&autoload=false"></script>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="title-box">
                <h2>🎬 촬영지 탐방 지도</h2>
                <p>내 주변 영화·드라마 속 명소 찾기</p>
            </div>

            <div class="tab-box">
                <button id="tab-attraction" class="tab-btn active" onclick="switchCategory('AT4')">🏛️ 관광명소</button>
                <button id="tab-food" class="tab-btn" onclick="switchCategory('FOOD_CE')">🍔 카페/음식점</button>
            </div>

            <ul id="places-list" class="places-list"></ul>
        </div>

        <div id="map" class="map-container"></div>
    </div>

        let map;
        let placeSearch;

        kakao.maps.load(function () {
            initializeMap();
        });

                center: defaultPosition,
                level: 5 // 확대 레벨 5
            };

            map = new kakao.maps.Map(mapContainer, mapOptions);
            placeSearch = new kakao.maps.services.Places();

            if (navigator.geolocation) {

                    const greenMarkerImage = new kakao.maps.MarkerImage(
                        '
